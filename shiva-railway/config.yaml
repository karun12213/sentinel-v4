# SHIVA V13 — Central Configuration (QUALITY FOCUS MODE)
# Optimized for $100 balance @ 0.01 lot to hit $400/week goal

# ── Phase 1: HTF Bias Engine ──────────────────────────────────────────────
htf_bias:
  enabled: true
  bullish_threshold: 15
  bearish_threshold: 15

# ── Phase 2: Kill Zone Time Filter (ENABLED) ─────────────
kill_zones:
  enabled: true
  avoid_monday_open: true
  avoid_friday_after: "12:00"

# ── Phase 4: Confluence Scoring ───────────────────────────────────────────
confluence:
  full_entry_threshold: 70
  half_entry_threshold: 50

# ── Phase 8: Dynamic Stop Loss ───────────────────────────────────────────
dynamic_sl:
  min_atr_mult: 1.0    # SL ≥ 1×ATR to survive normal noise
  max_atr_mult: 2.5
  breakeven_at_rr: 0.5  # move to BE at 0.5R profit
  tp_mult: 3.0          # 1:3 RR — validated on 9-month USOIL backtest
  trail_by_structure: true

# ── Phase 9: Circuit Breaker ─────────────────────────────────────────────
circuit_breaker:
  max_daily_losses: 2
  max_daily_drawdown_pct: 5.0
  max_daily_trades: 19     # User requested 19
  wr_alert_threshold: 0.45
  size_reduction_on_alert: 0.50


# ── Phase 10: Walk-Forward Backtesting ────────────────────────────────────
backtest:
  train_months: 6
  test_months: 2
  roll_months: 1
  initial_capital: 100.0
  symbols: ["CL=F"]
  timeframes: ["15m", "1h"]

# ── Phase 11: Performance Logger ─────────────────────────────────────────
performance:
  csv_export_path: "/tmp/shiva_trades"
  rolling_wr_window: 20
  wr_alert_threshold: 0.0
  daily_summary_hour_utc: 22
